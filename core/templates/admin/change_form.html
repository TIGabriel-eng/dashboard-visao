{% extends "admin/change_form.html" %}
{% load i18n static admin_urls %}

{% block content_title %}
  <div class="back-button-row">
    <a href="{% url opts|admin_urlname:'changelist' %}" class="back-link anim-slide-in">
      <i class="fa-solid fa-arrow-left"></i> Voltar à lista
    </a>
  </div>
  {{ block.super }}
  <style>
    @keyframes anim-slide {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .anim-slide-in {
      animation: anim-slide .35s ease-out;
    }
  </style>
{% endblock %}

{% block admin_change_form_document_ready %}
  {{ block.super }}
  <style>
    .gemini-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .gemini-fab__tooltip {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: #1e3a5f;
      background: #eef2ff;
      padding: 8px 14px;
      border-radius: 8px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    .gemini-fab__btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #eef2ff;
      border: 2px solid #c7d2fe;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: box-shadow .3s ease, transform .2s ease;
      box-shadow: 0 4px 12px rgba(99,102,241,.2);
      padding: 0;
    }
    .gemini-fab__btn:hover {
      transform: scale(1.05);
    }
    .gemini-fab__btn:active {
      transform: scale(.95);
    }
    .gemini-fab__btn img {
      width: 32px;
      height: 32px;
      display: block;
    }
    .gemini-fab__btn.is-loading img {
      display: none;
    }
    .gemini-fab__btn .spinner {
      display: none;
      width: 22px;
      height: 22px;
      border: 3px solid #e0e7ff;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: fab-spin .6s linear infinite;
    }
    .gemini-fab__btn.is-loading .spinner {
      display: inline-block;
    }
    .gemini-fab__btn--glow {
      animation: fab-glow .6s ease-out;
    }
    @keyframes fab-spin {
      to { transform: rotate(360deg) }
    }
    @keyframes fab-glow {
      0% { box-shadow: 0 0 0 0 rgba(99,102,241,.5); }
      50% { box-shadow: 0 0 30px 12px rgba(99,102,241,.3); }
      100% { box-shadow: 0 4px 12px rgba(99,102,241,.2); }
    }
    .admin-toast {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 99999;
      min-width: 280px;
      max-width: 420px;
      padding: 14px 18px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transform: translateX(120%);
      transition: transform .3s ease;
      pointer-events: auto;
    }
    .admin-toast.is-visible {
      transform: translateX(0);
    }
    .admin-toast--erro, .admin-toast--sucesso {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
    }
    .admin-toast__icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .admin-toast__text { flex: 1; }
    .admin-toast__close {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: inherit;
      opacity: .6;
      padding: 0 2px;
      flex-shrink: 0;
    }
    .admin-toast__close:hover { opacity: 1; }
  </style>

  <div class="gemini-fab" id="geminiFab">
    <span class="gemini-fab__tooltip">Precisa de ajuda? Use o Gemini</span>
    <button class="gemini-fab__btn" id="geminiFabBtn" title="Corrigir texto com IA">
      <img src="{% static 'admin/img/gemini.png' %}" alt="Gemini">
      <span class="spinner"></span>
    </button>
  </div>

  <script>
    (function() {
      function mostrarToast(mensagem, tipo) {
        tipo = tipo || 'erro';
        var existing = document.querySelector('.admin-toast');
        if (existing) existing.remove();
        var toast = document.createElement('div');
        toast.className = 'admin-toast admin-toast--' + tipo;
        var icones = { erro: '✕', sucesso: '✓' };
        toast.innerHTML =
          '<span class="admin-toast__icon">' + (icones[tipo] || 'i') + '</span>' +
          '<span class="admin-toast__text">' + mensagem + '</span>' +
          '<button class="admin-toast__close">&times;</button>';
        document.body.appendChild(toast);
        requestAnimationFrame(function() {
          toast.classList.add('is-visible');
        });
        toast.querySelector('.admin-toast__close').addEventListener('click', function() {
          toast.classList.remove('is-visible');
          setTimeout(function() { toast.remove(); }, 300);
        });
        setTimeout(function() {
          if (toast.parentNode) {
            toast.classList.remove('is-visible');
            setTimeout(function() { toast.remove(); }, 300);
          }
        }, 5000);
      }

      var fabBtn = document.getElementById('geminiFabBtn');
      if (fabBtn) {
        fabBtn.addEventListener('click', function() {
          if (fabBtn.classList.contains('is-loading')) return;

          var textarea = document.querySelector('textarea[name="descricao"], textarea[name="conteudo"]');
          if (!textarea) {
            mostrarToast('Nenhum campo de texto encontrado nesta p\u00e1gina.');
            return;
          }
          var texto = textarea.value.trim();
          if (!texto) {
            mostrarToast('O campo de texto est\u00e1 vazio.');
            return;
          }

          fabBtn.classList.remove('gemini-fab__btn--glow');
          void fabBtn.offsetWidth;
          fabBtn.classList.add('gemini-fab__btn--glow');

          fabBtn.classList.add('is-loading');

          fetch('{% url "corrigir-texto" %}', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]') ? document.querySelector('[name=csrfmiddlewaretoken]').value : '',
            },
            body: JSON.stringify({ texto: texto }),
          })
          .then(function(r) { return r.json(); })
          .then(function(dados) {
            if (dados.corrigido) {
              textarea.value = dados.corrigido;
              mostrarToast('Texto corrigido com sucesso!', 'sucesso');
            } else if (dados.erro) {
              mostrarToast(dados.erro);
            }
          })
          .catch(function(err) {
            mostrarToast('Erro ao conectar: ' + err.message);
          })
          .finally(function() {
            fabBtn.classList.remove('is-loading');
          });
        });
      }
    })();
  </script>
{% endblock %}
