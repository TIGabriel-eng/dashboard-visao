{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }}{% endblock %}

{% block extrahead %}
<style>
  .btn-return-panel {
    display: inline-block;
    padding: 8px 12px;
    background: #f4f4f4;
    color: #333;
    border: 1px solid #ccc;
    text-decoration: none;
    border-radius: 4px;
    font-size: 13px;
  }
  .btn-return-panel:hover {
    background: #e2e2e2;
  }
  .site-name { margin-left: 8px; }
  .return-panel-box { margin: 12px 0; }
</style>
{% endblock %}

{% block nav-global %}
  <div class="return-panel-box">
    <a class="btn-return-panel" href="{% url 'admin:index' %}">Voltar ao Painel do Django</a>
  </div>
{% endblock %}

{% block content_title %}
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
    <h1>{{ title }}</h1>
    <div style="display:flex;gap:8px;">
      <form method="POST" action="{% url 'admin:backup_database' %}" style="display:inline;">
        {% csrf_token %}
        <button class="btn-return-panel" type="submit">Backup DB</button>
      </form>
      <form method="POST" action="{% url 'admin:restore_database' %}" style="display:inline;" onsubmit="return confirm('Isso irá restaurar o backup mais recente. Continuar?');">
        {% csrf_token %}
        <button class="btn-return-panel" type="submit" style="background:#fff3cd;">Restaurar DB</button>
      </form>
    </div>
  </div>
{% endblock %}
