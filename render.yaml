services:
  - type: web
    name: dashboard-visao-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn visao_academy.wsgi:application --workers 2 --threads 2 --timeout 120 --worker-class sync
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_S3_ENDPOINT_URL
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_BUCKET_NAME
        value: "media"
      - key: SUPABASE_S3_REGION_NAME
        value: "us-east-1"
      - key: ALLOWED_HOSTS
        value: "dashboard-visao.onrender.com,visao-tributaria.vercel.app,localhost,127.0.0.1"
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"

  - type: cron
    name: orcoma-keep-alive
    runtime: python
    buildCommand: pip install requests
    schedule: "*/5 * * * *"
    startCommand: python keep_alive.py
    envVars:
      - key: APP_URL
        value: "https://dashboard-visao.onrender.com/api/ping/"
      - key: PYTHON_VERSION
        value: "3.12"


